{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Portfolio professionnel de Nancy Melissa, développeuse Python et Django."
    >

    <title>
        {% block title %}
            Nancy Melissa — Portfolio
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/output.css' %}"
    >
</head>

<body>

    {% include "pages/navbar.html" %}

    {% include "pages/messages.html" %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include "pages/footer.html" %}

    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}
    {% endblock %}

</body>
</html>
