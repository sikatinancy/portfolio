{% extends "base.html" %}

{% block title %}
    Connexion administrateur
{% endblock %}

{% block content %}

<section class="flex min-h-screen items-center justify-center px-6">

    <div class="w-full max-w-md">

        <div class="mb-8 text-center">

            <span class="text-3xl font-black">
                <span class="text-cyan-400">&lt;</span>
                ADMIN
                <span class="text-cyan-400">/&gt;</span>
            </span>

            <h1 class="mt-6 text-3xl font-black">
                Connexion
            </h1>

            <p class="mt-3 text-slate-400">
                Accédez à votre espace d'administration.
            </p>

        </div>


        <form
            method="POST"
            class="contact-card"
        >

            {% csrf_token %}


            {% if error %}

                <div class="mb-6 rounded-xl border border-red-400/20 bg-red-400/10 p-4 text-sm text-red-300">
                    {{ error }}
                </div>

            {% endif %}


            <label class="form-label">
                Adresse email
            </label>

            <input
                type="email"
                name="email"
                required
                class="form-input"
                placeholder="admin@example.com"
            >


            <label class="form-label mt-6">
                Mot de passe
            </label>

            <input
                type="password"
                name="password"
                required
                class="form-input"
                placeholder="••••••••"
            >


            <button
                type="submit"
                class="mt-7 w-full rounded-xl bg-cyan-400 py-4 font-bold text-slate-950"
            >
                Se connecter
            </button>

        </form>


        <div class="mt-6 text-center">

            <a
                href="{% url 'portfolio:home' %}"
                class="text-sm text-slate-500 hover:text-cyan-400"
            >
                ← Retour au portfolio
            </a>

        </div>

    </div>

</section>

{% endblock %}
