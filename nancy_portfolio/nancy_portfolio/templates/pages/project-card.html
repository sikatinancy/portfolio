<article class="project-card reveal">

    {% if project.image %}

        <img
            src="{{ project.image.url }}"
            alt="{{ project.title }}"
            class="project-image"
        >

    {% else %}

        <div class="project-image project-placeholder">
            {{ project.title|first }}
        </div>

    {% endif %}

    <div class="p-6">

        <h3 class="text-xl font-bold text-white">
            {{ project.title }}
        </h3>

        <p class="mt-3 line-clamp-3 text-sm leading-6 text-slate-400">
            {{ project.short_description }}
        </p>

        <div class="mt-5 flex flex-wrap gap-2">

            {% for technology in project.technology_list %}

                <span class="tech-badge">
                    {{ technology }}
                </span>

            {% endfor %}

        </div>

        <a
            href="{{ project.get_absolute_url }}"
            class="mt-6 inline-block font-semibold text-cyan-400 transition hover:text-cyan-300"
        >
            Voir le projet →
        </a>

    </div>

</article>
